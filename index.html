<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vitrina Amazonas</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0D0D0D;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 60px;
      color: #D8C3A5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #3F4A3C;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #3F4A3C;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>Vitrina Amazonas</h1>
  <p>Directorio digital de Puerto Ayacucho</p>

  <div class="grid">
    <div class="card">Servicios Profesionales</div>
    <div class="card">Moda</div>
    <div class="card">Comida</div>
    <div class="card">Postres</div>
    <div class="card">Nails</div>
    <div class="card">Delivery</div>
    <div class="card">Eventos</div>
    <div class="card">Repuestos</div>
  </div>

  <a class="btn" href="#">Quiero unirme</a>

</body>
</html>
